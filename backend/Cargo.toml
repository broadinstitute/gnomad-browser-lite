[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[features]
default = []
bundled = ["duckdb/bundled"]  # Use for production builds without system DuckDB
# Optional on-the-fly VEP annotation in the Hail backend (pulls in fastVEP via
# genohype-core). Off by default: the benchmark serves precomputed consequences,
# so the API image ships without it. Build with --features vep to enable locally.
vep = ["genohype-core/vep"]

[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
duckdb = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
async-trait = "0.1"
moka = { version = "0.12", features = ["future"] }
bytes = "1.0"
genohype-core = { path = "../../genohype/core", features = ["genomic", "gcp", "validation"] }
rlimit = "0.10"
clap = { version = "4.4", features = ["derive"] }
toml = "0.8"
pulldown-cmark = "0.12"
clickhouse = { version = "0.12", features = ["time"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "json"] }
# Official Elasticsearch client. Pinned to the 7.x line to match prod's ES 7.x
# server major (DESIGN.md "es" arm). rustls avoids a system OpenSSL/native-tls
# dependency on the benchmark VMs.
elasticsearch = { version = "7.17.7-alpha.1", default-features = false, features = ["rustls-tls"] }
genohype-pool = { path = "../../genohype/pool" }
genohype-mcp = { path = "../../genohype/mcp" }
rmcp = { version = "1.7", features = ["server", "transport-io"] }
schemars = "1"
futures = "0.3"
tokio-stream = "0.1"
async-stream = "0.3"
# Interval tree for the tiered router's hot/cold region routing (Phase 1c).
rust-lapper = "1.1"
