[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[features]
default = []
bundled = ["duckdb/bundled"]  # Use for production builds without system DuckDB

[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
duckdb = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
async-trait = "0.1"
moka = { version = "0.12", features = ["future"] }
bytes = "1.0"
genohype-core = { path = "../../genohype/core", features = ["genomic", "gcp", "validation"] }
rlimit = "0.10"
clap = { version = "4.4", features = ["derive"] }
toml = "0.8"
clickhouse = { version = "0.12", features = ["time"] }
